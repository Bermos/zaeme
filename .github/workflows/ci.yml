name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # The contract test (`test/api-contract.test.ts`) asserts, in both
      # directions, that the `/api/v1` route tree and
      # `docs/zaeme-api.openapi.yaml` describe the same surface. Enterprise
      # GENERATES its MCP tool surface from that document, so drift here breaks
      # a system that is not in this repository — it has to be caught on push.
      - name: Test
        run: pnpm run test
